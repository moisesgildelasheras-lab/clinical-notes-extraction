name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Solo lo necesario para los tests: sin sentence-transformers (torch) ni Ollama
      - run: pip install pytest numpy requests pydantic
      - run: python -m pytest -q
